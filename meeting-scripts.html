    if(b.t==='time'){h+='<div class="ttime">'+esc(b.v)+'</div>';}
    else{
      const spk=b.s?('<span class="tspk '+spkClass(b.s)+'">'+esc(b.s)+'</span>'):'<span class="tspk"></span>';
      h+='<div class="tline">'+spk+'<span class="ttxt">'+esc(b.x)+'</span></div>';
    }
  });
  document.getElementById('tx').innerHTML=h;
}
sel.onchange=render;
render();
</script>
</body>
</html>
