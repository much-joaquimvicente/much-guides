const sel=document.getElementById('pick');
M.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=m.label;sel.appendChild(o);});
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let speakers=[];
function spkClass(name){let i=speakers.indexOf(name);if(i<0){speakers.push(name);i=speakers.length-1;}return 's'+(i%2);}
function render(){
  const m=M[+sel.value];
  document.getElementById('date').textContent='🗓 '+m.date;
  document.getElementById('att').textContent='👥 '+m.attendees;
  document.getElementById('summary').innerHTML='<b>What this session covered.</b> '+m.summary;
  speakers=[];
  let h='';
  m.blocks.forEach(b=>{
    if(b.t==='time'){h+='<div class="ttime">'+esc(b.v)+'</div>';}
    else{
      const spk=b.s?('<span class="tspk '+spkClass(b.s)+'">'+esc(b.s)+'</span>'):'<span class="tspk"></span>';
      h+='<div class="tline">'+spk+'<span class="ttxt">'+esc(b.x)+'</span></div>';
    }
  });
  document.getElementById('tx').innerHTML=h;
}
sel.onchange=render;
render();
