function resChip(r){return r.url?`<a class="chip" href="${r.url}" target="_blank" rel="noopener">${r.label} ↗</a>`:`<span class="chip">${r.label}</span>`;}
function cardHTML(p){return `
  <div class="prod ${p.color}">
    <div class="p-top">
      <div class="p-ic">${p.ic}</div>
      <div style="min-width:0">
        <div class="p-name">${p.name}</div>
        <div class="p-sub">${p.sub}</div>
      </div>
      ${p.status?`<span class="p-status ${p.statusCls}">${p.status}</span>`:''}
    </div>
    <p class="p-desc">${p.desc}</p>
    ${p.note?`<div class="pnote">${p.note}</div>`:''}
    <div class="lab">Who it's for</div><p class="body">${p.who}</p>
    ${p.features?`<div class="lab">Key features</div><p class="body">${p.features}</p>`:''}
    <div class="lab">Resources</div>
    <div class="chips">${p.resources.map(resChip).join('')}${p.testing?resChip({label:'🔗 '+p.testing.label,url:p.testing.url}):''}</div>
    <div class="meta">${p.meeting?`<span><b>🗓 Meeting:</b> ${p.meeting}</span>`:''}${p.status?`<span><b>Status:</b> ${p.status}</span>`:''}</div>
  </div>`;}

/* ── search ── filters the cards on name, subtitle, description, audience,
   key features and resource labels. Every term must match (AND). ── */
const q=document.getElementById('q'), qhint=document.getElementById('qhint'), grid=document.getElementById('products');
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function haystack(p){
  return [p.name,p.sub,p.desc,p.who,p.features,p.note,p.status,(p.resources||[]).map(r=>r.label).join(' ')]
    .map(v=>String(v||'').replace(/<[^>]*>/g,' '))   // strip the <b> tags inside features/note
    .join(' ').toLowerCase();
}
function render(list){
  grid.innerHTML = list.length
    ? list.map(cardHTML).join('')
    : `<div class="p-empty">No products match “${esc(q.value.trim())}”.</div>`;
}
function runSearch(){
  const raw=(q.value||'').trim().toLowerCase();
  if(!raw){qhint.textContent='';render(PRODUCTS);return;}
  const terms=raw.split(/\s+/).filter(Boolean);
  const hits=PRODUCTS.filter(p=>{const h=haystack(p);return terms.every(t=>h.indexOf(t)>=0);});
  qhint.textContent=`${hits.length} of ${PRODUCTS.length}`;
  render(hits);
}
q.addEventListener('input',runSearch);
q.addEventListener('keydown',e=>{if(e.key==='Escape'){q.value='';runSearch();q.blur();}});
render(PRODUCTS);
</script>
